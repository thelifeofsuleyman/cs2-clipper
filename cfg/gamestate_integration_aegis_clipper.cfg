// CS2 Game State Integration config for the auto-clipper.
//
// PLACE this file at:
//   C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//
// CS2 reads any file matching gamestate_integration_*.cfg on launch.
// No restart needed — restart CS2 after placing the file.

"Aegis Clipper Service v1"
{
    "uri"           "http://127.0.0.1:3000"
    "timeout"       "5.0"
    "buffer"        "0.1"
    "throttle"      "0.5"
    "heartbeat"     "10.0"

    "data"
    {
        "provider"            "1"
        "map"                 "1"
        "round"               "1"
        "player_id"           "1"
        "player_state"        "1"
        "player_match_stats"  "1"

        // Off — we don't need to know about opponents
        "allplayers_id"       "0"
        "allplayers_state"    "0"
        "allplayers_match_stats" "0"
        "allplayers_weapons"  "0"
        "phase_countdowns"    "0"
        "bomb"                "0"
        "grenades"            "0"
    }
}
