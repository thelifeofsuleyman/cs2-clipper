name: Recording or FPS issue
description: Report capture, replay, or game performance problems.
body:
  - type: textarea
    id: symptoms
    attributes:
      label: What happened?
      description: Include your app version and the steps that reproduce the issue. For FPS reports, share the GPU, capture preset, and measured FPS with capture on and off in the same scene if possible.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Recorder diagnostics
      description: In RoundLatch (formerly Aegis Clipper), open Activity and select Copy recorder diagnostics. Paste the report here if you want to share it publicly.
      render: json
