# Build the Windows app on GitHub's runners and publish it to a Release.
#
# Trigger: push a tag like `v2.1.0` (or run the workflow manually). The job
# installs standard CPython, builds the PyInstaller app with a bundled ffmpeg,
# compiles the Inno Setup installer, zips a portable copy, and attaches both
# AegisClipper-Setup.exe and AegisClipper-portable.zip to the GitHub Release.
#
# Result: you never need a local Python toolchain — tag a version and the
# finished .exe shows up under Releases for anyone to download.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: write           # needed to create/update the Release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install flask requests obsws-python python-dotenv pytest
      - name: Run pytest
        run: python -m pytest -q

  build-windows:
    needs: test          # don't build/release if the tests fail
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Optional YouTube libs so the frozen app can upload to YouTube.
          pip install google-api-python-client google-auth-oauthlib

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build app, installer, and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Run the build as a child process so its throws don't kill this step
          # before we can capture and surface the output.
          pwsh -ExecutionPolicy Bypass -File packaging\build.ps1 -Ffmpeg -Installer -Portable *>&1 |
            Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Output "::group::Build output (tail)"
            Get-Content build-output.log -Tail 60
            Write-Output "::endgroup::"
            # Surface the last lines as annotations (readable via the API).
            Get-Content build-output.log -Tail 10 | ForEach-Object {
              if ($_ -and $_.Trim()) { Write-Output ("::error::" + $_.Trim()) }
            }
            exit $code
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            build/**/*.txt
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packaging/Output/AegisClipper-Setup.exe
            packaging/Output/AegisClipper-portable.zip
          generate_release_notes: true

      - name: Upload build artifacts (for manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AegisClipper
          path: |
            packaging/Output/AegisClipper-Setup.exe
            packaging/Output/AegisClipper-portable.zip
