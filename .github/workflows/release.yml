# Build the Windows app on GitHub's runners and publish it to a Release.
#
# Trigger: push a tag like `v2.1.0` (or run the workflow manually). The job
# installs standard CPython, builds the PyInstaller app with a bundled ffmpeg,
# compiles the Inno Setup installer, zips a portable copy, and attaches both
# RoundLatch-Setup.exe and RoundLatch-portable.zip to the GitHub Release.
#
# Result: you never need a local Python toolchain — tag a version and the
# finished .exe shows up under Releases for anyone to download.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install flask requests obsws-python python-dotenv pytest
      - name: Run pytest
        run: python -m pytest -q

  build-windows:
    needs: test          # don't build/release if the tests fail
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies + build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Optional YouTube libs so the frozen app can upload to YouTube.
          pip install google-api-python-client google-auth-oauthlib

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build app, installer, and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Run the build as a child process so its throws don't kill this step
          # before we can capture and surface the output.
          pwsh -ExecutionPolicy Bypass -File packaging\build.ps1 -Ffmpeg -Installer -Portable *>&1 |
            Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Output "::group::Build output (tail)"
            Get-Content build-output.log -Tail 60
            Write-Output "::endgroup::"
            # Surface the last lines as annotations (readable via the API).
            Get-Content build-output.log -Tail 10 | ForEach-Object {
              if ($_ -and $_.Trim()) { Write-Output ("::error::" + $_.Trim()) }
            }
            exit $code
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: |
            build-output.log
            build/**/*.txt
          if-no-files-found: ignore

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RoundLatch
          if-no-files-found: error
          path: |
            packaging/Output/RoundLatch-Setup.exe
            packaging/Output/RoundLatch-portable.zip

  publish:
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RoundLatch
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s RoundLatch-Setup.exe && test -s RoundLatch-portable.zip || exit 1
          assets=(RoundLatch-Setup.exe RoundLatch-portable.zip)
          notes=(--generate-notes)
          if [[ "$RELEASE_TAG" == v2.1.27 ]]; then
            # Old clients look for this asset by its exact name.
            cp RoundLatch-Setup.exe AegisClipper-Setup.exe
            assets+=("AegisClipper-Setup.exe#Installer for automatic upgrades from Aegis Clipper")
            notes=(--notes-from-tag)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "RoundLatch $RELEASE_TAG" "${notes[@]}" "${assets[@]}"
