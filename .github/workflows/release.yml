# Build the Windows app on GitHub's runners and publish it to a Release.
#
# Trigger: push a tag like `v2.1.0` (or run the workflow manually). The job
# installs standard CPython, builds the PyInstaller app with a bundled ffmpeg,
# compiles the Inno Setup installer, zips a portable copy, and attaches both
# AegisClipper-Setup.exe and AegisClipper-portable.zip to the GitHub Release.
#
# Result: you never need a local Python toolchain — tag a version and the
# finished .exe shows up under Releases for anyone to download.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: write           # needed to create/update the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Optional YouTube libs so the frozen app can upload to YouTube.
          pip install google-api-python-client google-auth-oauthlib

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build app, installer, and portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -Ffmpeg -Installer -Portable

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.txt
            build/**/*.toc
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packaging/Output/AegisClipper-Setup.exe
            packaging/Output/AegisClipper-portable.zip
          generate_release_notes: true

      - name: Upload build artifacts (for manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AegisClipper
          path: |
            packaging/Output/AegisClipper-Setup.exe
            packaging/Output/AegisClipper-portable.zip
